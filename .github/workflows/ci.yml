name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two jobs:
#   1. proof   - deterministic headless suite (bun test + secret scan), no audio hw.
#   2. browser - real OfflineAudioContext render proof via Playwright (chromium).
# The browser job builds public/render-harness.js and drives browser/render-harness.html.

jobs:
  proof:
    name: Headless proof suite (bun test + secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run proof suite (contract / shim-sync / unit / stress / render-proof / style / polyblep)
        run: bun test tests/

      - name: Secret scan (credentials must never land in the repo)
        run: bun run secret-scan

  browser:
    name: Browser render proof (Playwright + real OfflineAudioContext)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright chromium (+ system deps)
        run: bunx playwright install --with-deps chromium

      - name: Build render harness bundle
        run: bun run build:harness

      - name: Run browser render proof
        run: bun run test:browser

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
